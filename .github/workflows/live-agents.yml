name: Live agents

on:
  pull_request:
    paths:
      - 'Cargo*'
      - 'apps/wordcraft/**'
      - 'apps/wordcraft-cli/**'
      - 'crates/control-key/**'
      - 'crates/engine/**'
      - 'crates/mcp/**'
      - 'crates/ui-egui/**'
      - 'packaging/linux/flatpak/**'
      - '.github/workflows/live-agents.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Live agents (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Live agent Clippy
        run: cargo clippy -p wordcraft -p wordcraft-cli -p wordcraft-mcp -p wordcraft-ui-egui --all-targets --locked -- -D warnings
      - name: Transport, setup, and real MCP document integration
        run: cargo test -p wordcraft --locked
      - name: CLI stdio entry points
        run: cargo test -p wordcraft-cli --locked
      - name: MCP discovery and delivery
        run: cargo test -p wordcraft-mcp --locked
      - name: Isolated engine editing
        run: cargo test -p wordcraft-engine --locked
      - name: Agent consent and UI
        run: cargo test -p wordcraft-ui-egui agents --locked
      - name: Browser compatibility
        if: runner.os == 'Linux'
        run: cargo check -p wordcraft-web --target wasm32-unknown-unknown --locked

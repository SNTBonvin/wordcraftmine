name: Dependency security
on:
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', '**/Cargo.toml', '.github/workflows/security.yml']
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', '**/Cargo.toml', '.github/workflows/security.yml']
  schedule:
    - cron: '31 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check RustSec advisories
        run: cargo audit
